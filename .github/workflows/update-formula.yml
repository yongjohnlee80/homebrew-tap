name: update formula

# Keeps every Formula/<name>.rb on its project's newest release. It reads only
# public release assets (each archive's .sha256), so it needs no secrets: the
# job's own GITHUB_TOKEN is enough to push to this repository.

on:
  schedule:
    - cron: "17 */6 * * *"   # every six hours
  workflow_dispatch:
    inputs:
      formula:
        description: "Formula (blank for every one)"
        required: false
      tag:
        description: "Release tag (blank for the newest); needs a formula"
        required: false

permissions:
  contents: write

env:
  FORMULAE: "autodb autodoc"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render the formulae
        env:
          FORMULA: ${{ inputs.formula }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if [ -n "$TAG" ] && [ -z "$FORMULA" ]; then
            echo "::error::a tag needs a formula: every project has its own tags"
            exit 1
          fi
          for f in ${FORMULA:-$FORMULAE}; do
            case " $FORMULAE " in *" $f "*) ;; *) echo "::error::no formula $f"; exit 1 ;; esac
            sh scripts/update-formula.sh "$f" "$TAG"
          done
          if [ -z "$FORMULA" ] || [ "$FORMULA" = autodoc ]; then
            sh scripts/update-editor.sh "$TAG"
          fi

      - name: Commit each formula that changed
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in $FORMULAE; do
            # status, not diff: diff does not see a new, untracked formula
            if [ -z "$(git status --porcelain -- "Formula/$f.rb")" ]; then
              echo "Formula/$f.rb already current."
              continue
            fi
            tag="$(sed -n 's/^# Generated by scripts\/update-formula.sh from the \(v[^ ]*\) release.*/\1/p' "Formula/$f.rb")"
            git add "Formula/$f.rb"
            git commit -m "$f ${tag}"
          done
          if [ -n "$(git status --porcelain -- Casks/autodoc-editor.rb Formula/autodoc-editor.rb)" ]; then
            tag="$(sed -n 's/^# Generated by scripts\/update-editor.sh from the \(v[^ ]*\) release.*/\1/p' Casks/autodoc-editor.rb)"
            git add Casks/autodoc-editor.rb Formula/autodoc-editor.rb
            git commit -m "autodoc-editor ${tag}"
          fi
          git push

  test:
    needs: update
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        formula: [autodb, autodoc]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install and test from this tap
        env:
          FORMULA: ${{ matrix.formula }}
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv 2>/dev/null || /opt/homebrew/bin/brew shellenv 2>/dev/null || true)"
          brew tap yongjohnlee80/tap "$GITHUB_WORKSPACE"
          brew install "yongjohnlee80/tap/$FORMULA"
          brew test "yongjohnlee80/tap/$FORMULA"
          brew audit --strict --online "yongjohnlee80/tap/$FORMULA"

  editor:
    needs: update
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install and test the editor package when released
        run: |
          if [ ! -f Casks/autodoc-editor.rb ]; then
            echo "AutoDoc has not published editor packages yet"
            exit 0
          fi
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv 2>/dev/null || /opt/homebrew/bin/brew shellenv 2>/dev/null || true)"
          brew tap yongjohnlee80/tap "$GITHUB_WORKSPACE"
          if [ "$RUNNER_OS" = macOS ]; then
            brew install --cask yongjohnlee80/tap/autodoc-editor
            "/Applications/AutoDoc Editor.app/Contents/MacOS/autodoc-editor" --version
            brew audit --cask --strict --online yongjohnlee80/tap/autodoc-editor
          else
            brew install yongjohnlee80/tap/autodoc-editor
            brew test yongjohnlee80/tap/autodoc-editor
            brew audit --strict --online yongjohnlee80/tap/autodoc-editor
          fi
