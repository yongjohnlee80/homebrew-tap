name: update formula

# Keeps Formula/autodb.rb on the newest autodb release. It reads only public
# release assets (each archive's .sha256), so it needs no secrets: the job's own
# GITHUB_TOKEN is enough to push to this repository.

on:
  schedule:
    - cron: "17 */6 * * *"   # every six hours
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (blank for the newest)"
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render the formula
        env:
          TAG: ${{ inputs.tag }}
        run: sh scripts/update-formula.sh "$TAG"

      - name: Commit if it changed
        run: |
          if git diff --quiet -- Formula/autodb.rb; then
            echo "Formula already current."
            exit 0
          fi
          tag="$(sed -n 's/^# Generated by scripts\/update-formula.sh from the \(v[^ ]*\) release.*/\1/p' Formula/autodb.rb)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/autodb.rb
          git commit -m "autodb ${tag}"
          git push

  test:
    needs: update
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install and test from this tap
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv 2>/dev/null || /opt/homebrew/bin/brew shellenv 2>/dev/null || true)"
          brew tap yongjohnlee80/tap "$GITHUB_WORKSPACE"
          brew install yongjohnlee80/tap/autodb
          brew test yongjohnlee80/tap/autodb
          brew audit --strict --online yongjohnlee80/tap/autodb
